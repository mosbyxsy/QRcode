  <rect x="38" y="10" width="16" height="16" rx="4" fill="#ffffff"/>
  <rect x="10" y="38" width="16" height="16" rx="4" fill="#ffffff"/>
  <rect x="30" y="29" width="10" height="10" rx="3" fill="#b8e0d2"/>
  <rect x="44" y="42" width="10" height="12" rx="3" fill="#ffffff"/>
</svg>
